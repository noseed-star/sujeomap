name: build-kr

on:
  workflow_dispatch:
    inputs:
      sido:
        description: "처리할 시도 (예: 서울특별시, 부산광역시, 전국)"
        required: true
        default: "서울특별시"
      limit:
        description: "이번에 처리할 최대 주소 수 (0 = 제한 없음)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 한국 데이터 만들기
        run: python -u scripts/build_kr.py
        env:
          JUSO_SEARCH_KEY: ${{ secrets.JUSO_SEARCH_KEY }}
          JUSO_COORD_KEY: ${{ secrets.JUSO_COORD_KEY }}
          SIDO: ${{ inputs.sido }}
          LIMIT: ${{ inputs.limit }}

      - name: 결과 저장(커밋)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/kr.json data/kr_report.json data/cache || true
          git commit -m "data: 한국 데이터 갱신 (${{ inputs.sido }})" || echo "바뀐 내용 없음"
          git push
