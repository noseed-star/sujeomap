name: build-sbiz

on:
  workflow_dispatch:
    inputs:
      sido_cd:
        description: "시도 코드 (11 서울, 26 부산, 27 대구, 28 인천, 29 광주, 30 대전, 31 울산, 36 세종, 41 경기, 43 충북, 44 충남, 46 전남, 47 경북, 48 경남, 50 제주, 51 강원, 52 전북)"
        required: true
        default: "11"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 상가정보 음식점 받기
        run: python -u scripts/build_sbiz.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SIDO_CD: ${{ inputs.sido_cd }}

      - name: 결과 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/sbiz data/chains.json || true
          git commit -m "data: 상가정보 갱신 (${{ inputs.sido_cd }})" || echo "바뀐 내용 없음"
                    for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "다시 시도해요 ($i)"; sleep 5
          done
